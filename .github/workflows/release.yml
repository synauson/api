name: release

# A v* tag publishes synauson-api to PyPI: the Python code generated from the
# protos at that tag, versioned as the tag. Publishing uses PyPI Trusted
# Publishing (OIDC) from the `pypi` environment, so no token is stored here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The generators, pinned exactly: grpcio-tools' gencode sets the package's
  # protobuf and grpcio floors, and mypy-protobuf writes its type stubs.
  GRPCIO_TOOLS_VERSION: '1.80.0'
  MYPY_PROTOBUF_VERSION: '5.1.0'
  BUILD_VERSION: '1.6.1'
  # The strict type check of the built package.
  MYPY_VERSION: '2.4.0'
  TYPES_GRPCIO_VERSION: '1.84.0.20260928'
  TYPES_PROTOBUF_VERSION: '7.35.1.20260906'
  TYPES_GRPCIO_STATUS_VERSION: '1.0.0.20260408'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The package supports Python 3.11 and newer: the floors are tested on
      # the oldest, everything else on the newest (the default `python`).
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.14

      - name: Install the generators
        run: |
          python -m pip install "grpcio-tools==$GRPCIO_TOOLS_VERSION" \
            "mypy-protobuf==$MYPY_PROTOBUF_VERSION" "build==$BUILD_VERSION"

      - name: Check the version and the changelog
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" | grep -Eq '^1\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME is not v1.MINOR.PATCH"; exit 1; }
          grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || { echo "CHANGELOG.md has no dated section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the API reference is current
        run: |
          python -m grpc_tools.protoc -I. --include_source_info \
            --descriptor_set_out=api.binpb synauson/v1/*.proto
          python tools/gen_api_docs.py api.binpb > api.md
          diff -u docs/api.md api.md

      - name: Build the package
        run: |
          python tools/build_python.py "${{ steps.version.outputs.version }}" build/python
          python -m build build/python --outdir dist

      - name: Inspect the wheel and sdist
        run: python tools/build_python.py --inspect dist

      - name: Test the wheel with the newest dependencies, and type-check it
        run: |
          v="$RUNNER_TEMP/newest"
          python -m venv "$v"
          "$v/bin/pip" install "$(ls dist/*.whl)[status]" "mypy==$MYPY_VERSION" \
            "types-grpcio==$TYPES_GRPCIO_VERSION" "types-protobuf==$TYPES_PROTOBUF_VERSION" \
            "types-grpcio-status==$TYPES_GRPCIO_STATUS_VERSION"
          "$v/bin/pip" freeze
          "$v/bin/python" tools/build_python.py --check --status
          "$v/bin/python" tools/build_python.py --typecheck

      - name: Test the wheel at its oldest dependencies on the oldest Python
        run: |
          v="$RUNNER_TEMP/oldest"
          python3.11 -m venv "$v"
          "$v/bin/pip" install dist/*.whl
          "$v/bin/python" tools/build_python.py --check
          "$v/bin/pip" install $("$v/bin/python" tools/build_python.py --floors)
          "$v/bin/pip" check
          "$v/bin/pip" freeze
          "$v/bin/python" tools/build_python.py --check --status

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/synauson-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
